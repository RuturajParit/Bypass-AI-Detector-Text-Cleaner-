
apiVersion: batch/v1
kind: Job
metadata:
  name: text-cleaner
spec:
  backoffLimit: 0
  activeDeadlineSeconds: 180
  template:
    metadata:
      labels:
        app: text-cleaner
    spec:
      restartPolicy: Never
      containers:
        - name: cleaner
          image: DOCKERHUB_USERNAME/cca2-text-cleaner:latest
          imagePullPolicy: Always
          workingDir: /app
          command:
            - /bin/sh
            - -c
            - |
              python -u src/cleaner.py
              RESULT=$?
              echo "CLEANER_EXIT_CODE=$RESULT"
              sleep 120
              exit "$RESULT"
